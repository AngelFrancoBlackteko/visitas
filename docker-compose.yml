services:
  visitas:
    build: .
    image: visitas:latest
    container_name: visitas
    restart: unless-stopped
    # Run as the visitas service account. The image pins this user to UID/GID
    # 10001 and ./install.sh creates a matching host account, so bind-mounted
    # ./data/ is writable without any UID juggling. VISITAS_UID/VISITAS_GID
    # in .env override the names for the rare case where 10001 is taken on
    # the host.
    user: "${VISITAS_UID:-visitas}:${VISITAS_GID:-visitas}"
    ports:
      # VISITAS_BIND is the host address :3000 is published on. install.sh
      # sets it to 127.0.0.1 with --domain, so once Caddy fronts the app the
      # LAN can only reach it through Caddy. That matters because
      # TRUST_PROXY=1 makes the app believe X-Forwarded-For: a client hitting
      # :3000 directly could otherwise fake its IP and dodge rate limits.
      - "${VISITAS_BIND:-0.0.0.0}:${VISITAS_PORT:-3000}:3000"
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 64)}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-43200}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Public scheme + host as the kiosk sees it. install.sh sets this to
      # https://<domain> when --domain is used; the server drives the cookie
      # Secure flag off this value.
      BASE_URL: ${BASE_URL:-}
      # Set to 1 when the app sits behind the bundled Caddy (tls profile) so
      # rate limits see the real client IP. Leave empty for direct HTTP.
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Interface language until an admin picks one in Settings: es | en.
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-es}
      AD_BIND_PASSWORD: ${AD_BIND_PASSWORD:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMS_AUTH_TOKEN: ${SMS_AUTH_TOKEN:-}
    volumes:
      # SQLite database — persisted across container rebuilds
      - ./data:/app/data
      # JSON config — edit on host without rebuilding the image
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional TLS-terminating reverse proxy. Activated by the "tls" profile,
  # which install.sh enables via COMPOSE_PROFILES=tls in .env when you pass
  # --domain. Without a domain this service stays inactive and visitas keeps
  # serving plain HTTP on :3000.
  caddy:
    image: caddy:2-alpine
    container_name: visitas-caddy
    restart: unless-stopped
    profiles: ["tls"]
    depends_on:
      - visitas
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount the whole caddy/ directory so operators bringing their own cert
      # can drop cert.pem + key.pem alongside the Caddyfile and reference them
      # in the Caddyfile via /etc/caddy/<filename>.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  # Caddy's internal CA + Let's Encrypt account/cert state. Losing this means
  # devices that trusted the previous internal CA need to re-trust.
  caddy_data:
  caddy_config:
